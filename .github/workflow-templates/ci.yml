name: Verify library
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run test:e2e
      - run: npm ci --prefix examples/next
      - run: npx playwright test --config playwright.next.config.ts -g 'SSR page'
      - run: npm pack --dry-run --ignore-scripts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-report
          path: playwright-report/
